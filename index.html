        // 2. Web Audio API 音效处理
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(164.81, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                }
            } catch(e) { console.log('Audio error:', e); }

                answer: 1, // B

                options: ["国语月（Bulan Bahasa Kebangsaan）", "独立月（Bulan Kemerdekaan）", "青年科技节（Festival Belia）", "国家文化周（Minggu Kebudayaan）"],

            },
            {

                answer: 2, // C

            {

                options: ["拒绝学习其他任何语言", "认为国语只在应付学校考试时有用", "仅在出国旅游时才使用国语", "以流利、规范的国语进行沟通，并在正式与公共场合积极使用国语"],
                answer: 3, // D
                explanation: "尊崇国语是爱国精神的体现，公民应当在公共交往中积极且规范地使用国语，同时尊重并掌握其他语言。"

        ];

        // 全局变量
        let currentStudent = { name: '', email: '' };
        let currentQuestionIndex = 0;
        let score = 0;
        let timerInterval = null;
        let timeElapsed = 0;
        let teacherDataList = [];

        // 4. 实时监听 Firebase 数据库更新排行榜 (按分数降序)
        const scoresRef = collection(db, "quiz_scores");
        const q = query(scoresRef, orderBy("score", "desc"));

        onSnapshot(q, (snapshot) => {
            const leaderboardList = document.getElementById('leaderboard-list');
            leaderboardList.innerHTML = '';
            teacherDataList = [];

            let allRecords = [];
            snapshot.forEach((doc) => {
                allRecords.push(doc.data());
            });

            // 前端二次排序（同分时用时少的靠前）
            allRecords.sort((a, b) => {
                if (b.score !== a.score) {
                    return b.score - a.score;
                }
                return (a.timeElapsed || 0) - (b.timeElapsed || 0);
            });

            teacherDataList = allRecords;

            // 渲染前5名
            allRecords.slice(0, 5).forEach((data, index) => {
                const rank = index + 1;
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-white p-2.5 rounded-xl border border-slate-100 shadow-sm text-sm";
                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="font-bold ${rank === 1 ? 'text-amber-500' : rank === 2 ? 'text-slate-400' : rank === 3 ? 'text-amber-700' : 'text-slate-500'}">${rank}.</span>
                        <span class="font-semibold text-slate-700 truncate max-w-[100px]">${data.name}</span>
                    </div>
                    <div class="text-xs text-slate-500">
                        <span class="font-bold text-indigo-600">${data.score}分</span> (${data.timeElapsed || 0}s)
                    </div>
                `;
                leaderboardList.appendChild(item);
            });

            if (allRecords.length === 0) {
                leaderboardList.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">暂无答题记录</p>';
            }

            console.error("Firebase 读取错误: ", error);
            document.getElementById('leaderboard-list').innerHTML = '<p class="text-red-400 text-sm text-center py-4">排行榜读取失败</p>';
        });

            const email = document.getElementById('input-email').value.trim();
            const emailError = document.getElementById('email-error');

            if (!name || !email) {
                alert("请填写姓名和邮箱！");
                return;
            }

            if (!email.endsWith("@moe-dl.edu.my")) {
                emailError.classList.remove('hidden');
                return;
            } else {
                emailError.classList.add('hidden');
            }

            currentStudent = { name, email };
            
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');

            timeElapsed = 0;
            timerInterval = setInterval(() => {
                timeElapsed++;
                document.getElementById('quiz-timer').innerText = `⏱️ 用时: ${timeElapsed}s`;
            }, 1000);

            loadQuestion();
        };

        // 6. 加载题目
        function loadQuestion() {
            const qData = questions[currentQuestionIndex];
            document.getElementById('quiz-progress').innerText = `题目 ${currentQuestionIndex + 1}/15`;
            document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${qData.question}`;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            document.getElementById('explanation-box').classList.add('hidden');

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 font-medium text-slate-700 transition flex items-center gap-3";
                btn.innerHTML = `<span class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500">${String.fromCharCode(65 + idx)}</span> ${opt}`;
                btn.onclick = () => selectAnswer(idx);
                optionsContainer.appendChild(btn);
            });
        }

        // 7. 选择答案处理
        function selectAnswer(selectedIdx) {
            const qData = questions[currentQuestionIndex];
            const optionsContainer = document.getElementById('options-container');
            const buttons = optionsContainer.getElementsByTagName('button');

            for (let btn of buttons) {
                btn.disabled = true;
                btn.classList.add('cursor-not-allowed');
            }

            const expBox = document.getElementById('explanation-box');
            const expResult = document.getElementById('explanation-result');
            const expText = document.getElementById('explanation-text');

            if (selectedIdx === qData.answer) {
                playSound('correct');
                score += 10;
                document.getElementById('quiz-score').innerText = `得分: ${score}`;
                buttons[selectedIdx].classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                
                expResult.innerText = "✅ 回答正确！";
                expResult.className = "font-bold text-lg mb-1 text-emerald-700";
            } else {
                playSound('wrong');
                buttons[selectedIdx].classList.add('bg-rose-100', 'border-rose-500', 'text-rose-800');
                buttons[qData.answer].classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');

                expResult.innerText = "❌ 回答错误！";
                expResult.className = "font-bold text-lg mb-1 text-rose-700";
            }

            expText.innerText = qData.explanation;
            expBox.classList.remove('hidden');
        }

        // 8. 下一题或提交
        window.nextQuestion = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < 15) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        };

        // 9. 完成答题提交数据到 Firebase
        async function finishQuiz() {
            clearInterval(timerInterval);

            document.getElementById('view-quiz').classList.add('hidden');
            document.getElementById('view-result').classList.remove('hidden');

            document.getElementById('final-student-info').innerText = `${currentStudent.name} (${currentStudent.email})`;
            document.getElementById('final-score').innerText = `${score} 分`;

            try {
                await addDoc(collection(db, "quiz_scores"), {
                    name: currentStudent.name,
                    email: currentStudent.email,
                    score: score,
                    timeElapsed: timeElapsed,
                    createdAt: serverTimestamp()
                });
            } catch (e) {
                console.error("保存成绩失败: ", e);
            }
        }

        // 10. 教师专区逻辑
        window.openTeacherModal = () => {
            document.getElementById('teacher-modal').classList.remove('hidden');
            document.getElementById('teacher-auth-sec').classList.remove('hidden');
            document.getElementById('teacher-data-sec').classList.add('hidden');
            document.getElementById('teacher-password').value = '';
            document.getElementById('password-error').classList.add('hidden');
        };

        window.closeTeacherModal = () => {
            document.getElementById('teacher-modal').classList.add('hidden');
        };

        window.verifyTeacher = () => {
            const pwd = document.getElementById('teacher-password').value;
            if (pwd === "2020Hui%%") {
                document.getElementById('teacher-auth-sec').classList.add('hidden');
                document.getElementById('teacher-data-sec').classList.remove('hidden');
                renderTeacherTable();
            } else {
                document.getElementById('password-error').classList.remove('hidden');
            }
        };

        function renderTeacherTable() {
            const tbody = document.getElementById('teacher-table-body');
            tbody.innerHTML = '';
            teacherDataList.forEach(item => {
                const tr = document.createElement('tr');
                const dateStr = item.createdAt ? new Date(item.createdAt.seconds * 1000).toLocaleString('zh-CN') : '刚提交';
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-slate-800">${item.name}</td>
                    <td class="p-3 text-slate-600">${item.email}</td>
                    <td class="p-3 font-bold text-indigo-600">${item.score}</td>
                    <td class="p-3 text-slate-500">${item.timeElapsed}s</td>
                    <td class="p-3 text-xs text-slate-400">${dateStr}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
